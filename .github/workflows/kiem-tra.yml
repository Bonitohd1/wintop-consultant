# KIỂM TRA MỖI LẦN ĐẨY: cú pháp JS, trần cỡ index.html, và phép thử trình duyệt thật (Playwright, chặn mọi lời gọi ra ngoài).
# 27/11/2026: checkout/setup-python/setup-node len v7 (chay Node 24) + Node 20 -> 24. Node 20 het ho tro: GitHub canh bao + tu ep Node 24.
# Vercel/Netlify vẫn dựng như cũ; đây chỉ để thấy ĐỎ trước khi khách mở app. Chạy tay cùng lệnh: python tests/chay_het.py
name: Kiểm tra app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: kiem-tra-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium webkit
      - name: Chạy hết (cỡ file + cú pháp + phép thử trình duyệt)
        run: python tests/chay_het.py
